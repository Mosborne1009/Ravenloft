const IB={Zombie:-2,Wolf:2,'Dire Wolf':2,Skeleton:2,Ghoul:2,'Strahd Zombie':-2,'Vampire Spawn':3,Werewolf:1,'Strahd von Zarovich':4,'Swarm of Bats':2,'Barovian Witch':0,'Animated Armor':0,Bandit:1,Doru:0};
const ITEMS={'Potion of Healing':'Drink to regain 2d4+2 HP.','Potion of Greater Healing':'Drink to regain 4d4+4 HP.','Potion of Superior Healing':'Drink to regain 8d4+8 HP.','Potion of Supreme Healing':'Drink to regain 10d4+20 HP.','Potion of Fire Resistance':'Resistance to fire damage for 1 hour.','Potion of Invisibility':'Invisible for 1 hour, ends early if you attack or cast a spell.','Potion of Speed':'Hasted for 1 minute.','Antitoxin':'Advantage on saves against poison for 1 hour.','Holy Water':'Thrown flask: 2d6 radiant damage to a fiend or undead it splashes.','Alchemist’s Fire':'Thrown flask: 1d4 fire damage each turn until put out (Dex DC 10).','Acid Vial':'Thrown: 2d6 acid damage on a hit.','Healer’s Kit':'10 uses. Stabilize a creature at 0 HP without a check.','Silvered Weapon':'Counts as silvered against creatures resistant to nonmagical weapons, like werewolves.','Holy Symbol':'Spellcasting focus for clerics and paladins.','Bag of Holding':'Holds up to 500 lb in an extradimensional space; weighs 15 lb.','Cloak of Protection':'+1 AC and +1 to saving throws. Requires attunement.','Ring of Protection':'+1 AC and +1 to saving throws. Requires attunement.','Cloak of Elvenkind':'Advantage on Stealth; others have disadvantage on Perception checks to see you. Requires attunement.','Cloak of Displacement':'Attackers have disadvantage against you until you take damage. Requires attunement.','Boots of Elvenkind':'Your steps make no sound. Advantage on Stealth checks that rely on moving silently.','Gauntlets of Ogre Power':'Strength becomes 19. Requires attunement.','Headband of Intellect':'Intelligence becomes 19. Requires attunement.','Amulet of Health':'Constitution becomes 19. Requires attunement.','Goggles of Night':'Darkvision out to 60 ft (or extends existing darkvision by 60 ft).','Ring of Resistance':'Resistance to one damage type, set by its gem. Requires attunement.','Wand of Magic Missiles':'7 charges, regains some at dawn. Each charge casts Magic Missile; spend more for extra darts.','Wand of Fireballs':'7 charges, regains some at dawn. Spend 3 charges to cast Fireball (DC 15); more charges raise the level.','Flame Tongue':'Command word ignites the blade: +2d6 fire damage on hits. Requires attunement.','Gold Pieces':'Coins. Put the amount in the name, like “120 gp”.','Gemstone':'A valuable gem. Put its worth in the name.'};
const LL=Object.keys(ITEMS).concat(Object.values(AC).filter(a=>a.s).map(a=>'Scroll of '+a.n));
/* ================= state ================= */
let S;try{S=JSON.parse(localStorage.getItem("rcl"))}catch(e){}S=S||{party:[],battles:[],cur:null};
S.tpl=S.tpl||{};S.enc=S.enc||{};
/* which shared game is this, and is this device the DM? */
const QS=new URLSearchParams(location.search),HK=(location.hash.match(/dm=([\w-]+)/)||[])[1];
let GAME=null;try{GAME=JSON.parse(localStorage.getItem('rcl_game'))}catch(e){}
let GID=QS.get('g')||(GAME&&GAME.g)||null;if(GID&&!/^[\w-]{4,40}$/.test(GID))GID=null;
let KEY=GID?(HK||(GAME&&GAME.g==GID?GAME.k:null)||null):null;
if(GID&&KEY){GAME={g:GID,k:KEY};try{localStorage.setItem('rcl_game',JSON.stringify(GAME))}catch(e){}}
const ISPL=!!GID&&!KEY;
let tab="combat",mode=ISPL?"pl":"dm",share=false,P=null,PP=null,modal=null,info=null,dg=null,ED=null,LOGS={},RCK='';
try{share=localStorage.getItem('rcl_share')=='1'}catch(e){}
let UN=[],prevS=JSON.stringify(S.cur),VD={},pdone=false;
let seenC=false,LO={};function tl(i){LO[i]=!LO[i];render()}
let PI='';
let NETA=null,UID=null,ISDM=false,CL={},SH={},PL=[],PK='',pTab='b',SHM='',shT=null,NETERR='',CONN=false,INITS={},INA={},LIVEJ='',SYNC=false,pushT=null,LT=0,DEV='';
try{LT=+localStorage.getItem('rcl_t')||0;DEV=localStorage.getItem('rcl_dev')||'';if(!DEV){DEV=U()+U();localStorage.setItem('rcl_dev',DEV)}}catch(e){}
const B=()=>'games/'+GID+'/';
/* ================= helpers ================= */
const T=()=>({...TPL,...(S.tpl||{})}),EN=()=>({...(S.enc||{}),...ENC});
const gc=id=>S.cur.cs.find(c=>c.id==id);
const srt=()=>S.cur.cs.map((c,i)=>[c,i]).sort((a,b)=>b[0].init-a[0].init||(b[0].dx||0)-(a[0].dx||0)||a[1]-b[1]).map(x=>x[0]);
const pct=c=>c.max?c.hp/c.max:0,col=p=>p>.5?"#3fa34d":p>.25?"#d4a72c":"#c0392b",stt=c=>{const p=pct(c);return p>.5?"Healthy":p>.25?"Bloodied":p>0?"Near death":"Down"};
const skp=c=>(c.type=="en"&&c.hp<=0)||c.dead||c.stab;
const slain=c=>(c.type=='en'&&c.hp<=0)||c.dead;
const ib=t=>{const x=(S.tpl||{})[t];return x&&x[2]!=null?x[2]:(IB[t]||0)};
const sg=n=>(n<0?'−':'+')+Math.abs(n);
const pst=p=>[p.pp?'Passive Perception '+p.pp:'',p.dc?'Spell DC '+p.dc:'',p.sp?'Speed '+p.sp+' ft':'',p.rs?E(p.rs):''].filter(Boolean).join(' · ');
function agg(logs){const m={};for(const L of logs)for(const e of L){if(e.src=="Environment/Unknown")continue;const s=m[e.src]=m[e.src]||{dmg:0,heal:0,k:0,hi:0,cr:0,sp:0,by:{}};if(e.ty=="Healing")s.heal+=e.amt;else{s.dmg+=e.amt;s.hi=Math.max(s.hi,e.amt);s.by[e.ty]=(s.by[e.ty]||0)+e.amt}if(e.kill)s.k++;if(e.crit)s.cr++;if((AC[(e.act||"").toLowerCase()]||{}).s)s.sp++}return m}
window.alert=function(m){document.body.insertAdjacentHTML('beforeend',`<div class=ov id=al><div class=card><p>${E(m)}</p><button class=p onclick="document.getElementById('al').remove()">OK</button></div></div>`)};
/* ================= saving, undo ================= */
const IDB=(()=>{const o=new Promise((res,rej)=>{try{const r=indexedDB.open('rcl',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});return{get:()=>o.then(d=>new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})).catch(()=>{}),set:v=>o.then(d=>{d.transaction('k','readwrite').objectStore('k').put(v,'s')}).catch(()=>{})}})();
function sv(){
const c=S.cur;
if(c){const en=c.cs.filter(x=>x.type=='en');c.won=en.length>0&&en.every(x=>x.hp<=0)}
const now=JSON.stringify(c);
if(now!==prevS){
try{const p=JSON.parse(prevS);if(p&&c&&p.id==c.id){const dd=c.cs.filter(x=>x.type=='en'&&x.hp<=0&&((p.cs.find(y=>y.id==x.id)||{}).hp||0)>0);if(dd.length)slay(dd)}}catch(e){}
UN.push(prevS);if(UN.length>25)UN.shift();prevS=now}
LT=Date.now();
try{localStorage.setItem('rcl',JSON.stringify(S));localStorage.setItem('rcl_t',LT)}catch(e){}
bc();render();IDB.set(JSON.stringify(S));pubParty();dmPush()}
function undo(){if(!UN.length)return;prevS=UN.pop();S.cur=JSON.parse(prevS);if(S.cur&&S.battles.length&&S.battles[S.battles.length-1].id==S.cur.id)S.battles.pop();sv()}
/* ================= live sharing ================= */
function snap(){const c=S.cur,pcs=new Set(c.cs.filter(x=>x.type=="pc").map(x=>x.name)),a=agg([c.log]),lb={};for(const k in a)if(pcs.has(k))lb[k]=[a[k].dmg,a[k].heal,a[k].k];return{round:c.round,turn:c.turn,lb,cs:srt().map(x=>x.type=="pc"?{id:x.id,n:x.name,pc:1,hp:x.hp,max:x.max,t:x.temp,cd:x.conds}:{id:x.id,n:x.name,st:stt(x),cd:x.conds})}}
function vic(){const c=S.cur,pcs=new Set(c.cs.filter(x=>x.type=='pc').map(x=>x.name)),a=agg([c.log]);return{rounds:c.round,en:c.cs.filter(x=>x.type=='en').length,rows:Object.entries(a).filter(([n])=>pcs.has(n)).sort((x,y)=>y[1].dmg-x[1].dmg).map(([n,s])=>({n,d:s.dmg,h:s.heal,k:s.k,hi:s.hi,c:s.cr}))}}
function bc(){
if(!NETA||!ISDM||!SYNC)return;let d;
if(!share)d={off:1};
else{d=S.cur?snap():{none:1};d.chest=S.chest?{open:!!S.chest.open,items:S.chest.open?S.chest.items:[]}:null;d.victory=S.cur&&S.cur.won?vic():null;d.rc=S.cur&&S.cur.rc?S.cur.cs.filter(c=>c.type=='pc').map(c=>({id:c.pid||c.id,n:c.name,ok:!!c.rdy})):null}
const j=JSON.stringify(d);if(j===LIVEJ)return;LIVEJ=j;NETA.set(B()+'live',{j}).catch(()=>{LIVEJ=''})}
function tg(){if(!GID)return alert(window.FB_CONFIG?'Create a shared game on the Party tab first.':'Sharing isn’t set up in this copy yet.');share=!share;try{localStorage.setItem('rcl_share',share?'1':'0')}catch(e){}bc();render()}
function md(){mode=mode=="dm"?"pl":"dm";render()}
/* ================= dialogs ================= */

function dgGo(){const f=dg&&dg.f;dg=null;if(f)f();render()}
function dgX(){dg=null;render()}
function dgH(){return`<div class=ov><div class=card><h3>${E(dg.t)}</h3>${dg.b}<div class=r><button class=p onclick=dgGo()>${E(dg.ok)}</button>${dg.f?'<button onclick=dgX()>Cancel</button>':''}</div></div></div>`}
/* ================= combat actions ================= */
function nb(enc){S.cur={id:U(),date:Date.now(),round:1,turn:null,cs:[],log:[]};S.chest=S.loot&&S.loot[enc]?{items:S.loot[enc].map(x=>({n:x.n,d:x.d})),open:false}:null;(EN()[enc]||[]).forEach(([t,n])=>{for(let i=0;i<n;i++)addEn(t,1)});sv()}
function newB(enc){S.cur?dlg('Discard the current battle without saving?','',()=>nb(enc),'Discard'):nb(enc)}
function addEn(t,q){const[h,a]=T()[t],cs=S.cur.cs,n=cs.filter(c=>c.base==t).length,pf=PF[t]||{};if(n==1)cs.find(c=>c.base==t).name=t+" 1";const c={id:U(),base:t,name:n?t+" "+(n+1):t,type:"en",max:h,hp:h,temp:0,ac:a,init:0,dx:0,conds:[]};if(pf.lr)c.lr=pf.lr;if(pf.la)c.lm=c.la=pf.la;cs.push(c);if(!q)sv()}
function addPC(pid){const p=S.party.find(x=>x.id==pid),h=Math.max(0,+$("#h"+pid).value||0);S.cur.cs.push({id:U(),pid,name:p.name,type:"pc",max:p.max,hp:Math.min(h,p.max),temp:0,ac:p.ac,init:0,conds:[]});sv()}
function setI(id,v){const c=gc(id);c.init=+v||0;if(S.cur.rc&&c.type=='pc')c.rdy=true;sv()}
function setD(id,v){gc(id).dx=+v||0;sv()}
function nx(){
if(!S.cur)return;const s=srt();if(!s.length)return;
const r=S.cur.round;let i=s.findIndex(c=>c.id==S.cur.turn);
if(i>=0)s[i].conds=s[i].conds.map(k=>k.d!=null?{n:k.n,d:k.d-1}:k).filter(k=>k.d==null||k.d>0);
let n=0;do{i++;if(i>=s.length){i=0;S.cur.round++}}while(skp(s[i])&&++n<=s.length);
S.cur.turn=s[i].id;
if(S.cur.round>r)S.cur.cs.forEach(c=>{if(c.lm)c.la=c.lm});

const lair=c.cs.some(x=>(PF[x.base]||{}).lair)?`<div class='card mu'>🏰 Lair actions on initiative 20 if fighting in the lair. Legendary actions at the end of other creatures’ turns.</div>`:'';
const call=!c.rc&&!c.turn&&pcs.length?`<button class=p onclick=startRC()>⚔ Call for initiative</button>`:'';
const roll=!c.turn?`<button onclick=rollE()>🎲 Roll enemy initiative</button>`:'';
return ready+chest+lair+`<div class=card><div class=r><b>Round ${c.round}</b><span class=mu>${t?"Turn: "+E(t.name):"Set initiative, then Next Turn"}</span></div><div class=r>${call}${roll}<button class=p onclick=nx()>Next Turn</button><button onclick="dm('env')">Environment</button><button onclick=undo()>↶ Undo</button><button onclick=endB()>End &amp; Save</button></div></div>${lineupH()}<div class=card><h3>Add to fight</h3>${free.map(p=>`<div class=r><span>${E(p.name)}</span><span>HP <input type=number id="h${p.id}" value=${p.max}> <button onclick="addPC('${p.id}')">Add</button></span></div>`).join("")||'<div class=mu>All party members are in (or add some on the Party tab).</div>'}<div class=r><select id=et style="flex:1">${Object.keys(T()).map(k=>`<option>${E(k)}</option>`).join("")}</select><button onclick="addEn($('#et').value)">Add enemy</button></div></div>`}
function modalH(){
const c=S.cur,s=modal=="env"?{name:"Environment / hazard"}:gc(modal),p=modal!="env"&&PF[s.base];
return`<div class=ov><div class=card><h3>${E(s.name)} acts</h3>${p?`<div class=mu style='margin-bottom:6px'>${E(p.t)}</div>`:''}<label>Action / spell<input id=mx list=al oninput=fillT() autocomplete=off placeholder="Type to search or write your own"></label><datalist id=al>${Object.values(AC).map(a=>`<option value="${E(a.n)}">`).join("")}</datalist><label>Target(s)</label>${c.cs.filter(x=>!slain(x)).map(x=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type=checkbox class=mt2 value=${x.id}> ${E(x.name)} <span class=mu>${x.hp}/${x.max}</span><select class=mm data-i=${x.id} style='width:auto;padding:4px'><option value=1>Full</option><option value=.5>½</option><option value=2>×2</option><option value=0>0</option></select></label>`).join("")}<div class=g><label>Amount (each)<input type=number inputmode=numeric id=ma></label><label>Type (Healing heals)<select id=mt>${TYPES.map(x=>`<option>${x}</option>`).join("")}</select></label></div><label><input type=checkbox id=mc> Critical hit</label><div class=r><button class=p onclick=ap()>Apply</button><button onclick=cm()>Cancel</button></div></div></div>`}
function infH(){
const c=gc(info),p=PF[c.base]||{},pc=S.party.find(x=>x.id==c.pid),st=pc&&pst(pc);
return`<div class=ov><div class=card><h3>${E(c.name)}</h3>${st?`<div class=mu style='margin-bottom:6px'>${st}</div>`:''}${p.t?`<p>${E(p.t)}</p>`:'<p class=mu>No profile. Use notes below.</p>'}<label>DM notes<textarea id=nt rows=3>${E(c.note||'')}</textarea></label><div class=r><button class=p onclick=svN()>Save</button><button onclick='info=null;render()'>Close</button></div></div></div>`}
function vicH(v,btn){return`<div class=ov style='align-items:flex-start'><div class=card style='text-align:center;max-width:460px;background:radial-gradient(circle at 50% 0,#4a3a12,#140d0f 65%);border-color:#c9a24a'><div style='font-size:56px;animation:dr .8s both'>⚔️</div><h1 style='font-size:34px;color:#e0b43c;text-shadow:0 0 18px #c43a44;animation:vp 1s both'>VICTORY</h1><div class=mu>${v.rounds} round${v.rounds==1?'':'s'} · ${v.en} foe${v.en==1?'':'s'} defeated</div>${v.rows.map(r=>`<div class=r style='border-top:1px solid var(--ln);padding:6px 0'><b>${E(r.n)}</b><span class=mu>${r.d} dmg · ${r.h} healed · ${r.k} kills${r.hi?' · best hit '+r.hi:''}${r.c?' · '+r.c+' crits':''}</span></div>`).join('')||'<div class=mu>No attacks were logged.</div>'}${btn}</div></div>`}
function prep(){
const ed=ED&&S.enc&&S.enc[ED]?ED:null,cnt={};
if(ed)S.enc[ed].forEach(([t,n])=>{cnt[t]=n});
const lt=ed?((S.loot||{})[ed]||[]).map(x=>x.n+(x.d?' | '+x.d:'')).join('\n'):'';
return`<div class=card><h3>Custom enemy</h3><div class=r><input id=tn placeholder=Name style="flex:2"><input id=th type=number placeholder=HP><input id=ta type=number placeholder=AC><input id=ti type=number placeholder='Init bonus'></div><button class=p onclick=addT()>Save enemy</button><div class=mu>Enter stats from your book once; they’re kept for every battle.</div></div>`
+`<div class=card><h3>${ed?`Editing: ${E(ed)}`:'Build an encounter'}</h3>${ed?`<input id=en value="${E(ed)}" placeholder="Encounter name">`:`<input id=en placeholder="e.g. S1 – Death House: Cellar">`}<div class=g style="margin-top:8px">${Object.keys(T()).map(k=>`<label style="display:flex;justify-content:space-between;align-items:center;color:var(--tx)">${E(k)} <input type=number class=ec data-t="${E(k)}" min=0 value=${cnt[k]||0}></label>`).join("")}</div><label>Loot (one per line: Item | description)<textarea id=lt rows=3 placeholder='Potion of Healing | Heals 2d4+2'>${E(lt)}</textarea></label><div class=r><input id=li list=ldl placeholder='Search items or "Scroll of Fireball"' style='flex:1'><button onclick=addLoot()>Add</button><button onclick=fillLoot()>Autofill</button></div><datalist id=ldl>${LL.map(x=>`<option value="${E(x)}">`).join('')}</datalist><div class=mu>Add puts an item and a short description on its own line. Autofill completes any line that has a name but no description.</div>${ed?`<div class=r><button class=p onclick=saveE()>Save changes</button><button onclick=cancelE()>Cancel</button></div>`:`<button class=p onclick=saveE()>Save encounter</button>`}</div>`
+Object.entries(S.enc||{}).map(([k,v])=>`<div class=card><div class=r><b>${E(k)}</b><span><button onclick="editE(this.dataset.k)" data-k="${E(k)}">Edit</button> <button onclick="delE(this.dataset.k)" data-k="${E(k)}">Delete</button></span></div><div class=mu>${v.map(x=>x[1]+"× "+E(x[0])).join(", ")}</div></div>`).join("")}
function party(){
const on=NETA&&ISDM,rows=on?S.party.map(p=>{const u=CL[p.id];return`<div class=r><span><b>${E(p.name)}</b> <span class=mu>• ${u?'claimed':'unclaimed'}</span></span><span><button onclick="dmSheet('${p.id}')">Sheet</button>${u?` <button onclick="relC('${p.id}')">Release</button>`:''}</span></div>`}).join(''):'';
return`<div class=card><h3>Add character</h3><div class=r><input id=pn placeholder=Name style="flex:2"><input id=pm type=number placeholder="Max HP"><input id=pa type=number placeholder=AC></div><div class=r><input id=pp type=number placeholder='Passive Perc.'><input id=pd type=number placeholder='Spell DC'><input id=ps type=number placeholder='Speed'><input id=pr placeholder='Resist./notes'></div><button class=p onclick=addP()>Add</button></div>`
+S.party.map(p=>{const s=pst(p);return`<div class=card><div class=r><span><b>${E(p.name)}</b> <span class=mu>${p.max} HP · AC ${p.ac}</span>${s?`<div class=mu>${s}</div>`:''}</span><span><button onclick="edP('${p.id}')">Edit</button> <button onclick="rmP('${p.id}')">✕</button></span></div></div>`}).join("")
+linksH()
+(on?`<div class=card><h3>Players &amp; sheets</h3>${rows||'<div class=mu>Add characters first.</div>'}<div class=mu>Players claim a character from their phone. Their sheet stats update your party automatically.</div></div>`:'')
+`<div class=card><h3>Backup</h3><textarea id=bk rows=4 placeholder="Export fills this box; paste a backup here to import"></textarea><div class=r><button onclick=exp()>Export JSON</button><button onclick=imp()>Import JSON</button></div></div>`}
function hist(){if(!S.battles.length)return`<div class="card mu">No saved battles yet.</div>`;return[...S.battles].reverse().map(b=>{const a=agg([b.log]);return`<div class=card><div class=r><b>${new Date(b.date).toLocaleDateString()}</b><span class=mu>${b.rounds} rounds · ${b.log.length} events</span></div>${Object.entries(a).map(([n,s])=>`<div class=mu>${E(n)}: ${s.dmg} dmg · ${s.heal} healed · ${s.k} kills</div>`).join("")}<div class=r><button onclick="tlog('${b.id}')">${LOGS[b.id]?"Hide":"Full"} log</button><button onclick="delB('${b.id}')">Delete</button></div>${LOGS[b.id]?b.log.map(e=>`<pre>R${e.r} ${E(e.src)} → ${E(e.tgt)}: ${e.amt} ${e.ty}${e.crit?" (crit)":""}${e.act?" · "+E(e.act):""}${e.kill?" ☠":""}</pre>`).join(""):""}</div>`}).join("")}
function life(){const a=agg(S.battles.map(b=>b.log)),k=Object.keys(a);if(!k.length)return`<div class="card mu">Save a battle to see lifetime stats.</div>`;return k.sort((x,y)=>a[y].dmg-a[x].dmg).map(n=>{const s=a[n];return`<div class=card><b>${E(n)}</b><div class=g><span>Damage: ${s.dmg}</span><span>Healing: ${s.heal}</span><span>Kills: ${s.k}</span><span>Spells cast: ${s.sp}</span><span>Highest hit: ${s.hi}</span><span>Crits: ${s.cr}</span></div><div class=mu>${Object.entries(s.by).map(([t,v])=>t+" "+v).join(" · ")||"No damage dealt"}</div></div>`}).join("")}
function chestH(c){const an=!seenC;setTimeout(()=>{seenC=true},60);return`<div class=card style='text-align:center'><svg viewBox='0 0 120 90' width=150><g style='transform-origin:15px 42px;${an?'animation:lid .9s ease forwards':'transform:rotate(-55deg)'}'><rect x=15 y=20 width=90 height=22 rx=6 fill=#6b3b1e stroke=#c9a24a stroke-width=3 /></g><rect x=15 y=40 width=90 height=40 rx=4 fill=#5a2f17 stroke=#c9a24a stroke-width=3 /><rect x=52 y=36 width=16 height=14 rx=2 fill=#c9a24a /><ellipse cx=60 cy=41 rx=40 ry=7 fill=#ffd770 style='opacity:.85;${an?'animation:gl 1.2s':''}' /></svg><h3>Treasure!</h3>${c.items.map((x,i)=>`<div class=card style='text-align:left;cursor:pointer;${an?`animation:fi .5s both;animation-delay:${.9+i*.2}s`:''}' onclick=tl(${i})><b>${E(x.n)}</b>${LO[i]?`<div class=mu style='margin-top:4px'>${E(x.d||'No further details.')}</div>`:'<span class=mu> · tap for details</span>'}</div>`).join('')}</div>`}
function claimUI(){const o=PL.filter(x=>!CL[x.id]||CL[x.id]==UID);return`<label>Who are you playing?<select onchange='pme(this.value)'><option value=''>Choose your character</option>${o.map(x=>`<option value="${x.id}">${E(x.n)}</option>`).join('')}</select></label>${PL.length?'':'<div class=mu>Waiting for the DM to set up the party…</div>'}`}
function readyH(){const rc=P.rc,mp=myPid(),me=rc.find(x=>x.id==mp),pick=mp?`<div class=r><span>Playing <b>${E(((rc.find(x=>x.id==mp)||PL.find(x=>x.id==mp))||{}).n||'')}</b></span><button onclick=unclaim()>Not me</button></div>`:claimUI();return`<div class=card style='border-color:#c9a24a;text-align:center'><h3>⚔ Roll for initiative!</h3><div class=mu>The DM has called for initiative.</div></div><div class=card>${pick}<div class=r><input id=pi type=number inputmode=numeric placeholder='Your initiative total' value="${E(PI)}" oninput='PI=this.value' style='flex:1'><button class=p onclick=psub()>Submit</button></div>${me&&me.ok?'<div style="color:#3fa34d">✔ Locked in. You can resubmit to change it.</div>':''}</div><div class=card><h3>Party</h3>${rc.map(x=>`<div class=r><span>${x.ok?'<b style="color:#3fa34d">✔</b>':'<span class=mu>⏳</span>'} ${E(x.n)}</span><span class=mu>${x.ok?'Ready':'Waiting…'}</span></div>`).join('')}</div>`}
const fld=(k,l,v,t)=>`<label>${l}<input id=sh_${k} ${t?'type=number inputmode=numeric':''} value="${E(v==null?'':v)}" onchange=shSave()></label>`,ar=(k,l,v)=>`<label>${l}<textarea id=sh_${k} rows=3 onchange=shSave()>${E(v||'')}</textarea></label>`;
function sheetH(){if(!NETA)return`<div class='card mu'>${NETERR?E(NETERR):'Character sheets need the shared game. Check your connection.'}</div>`;const pid=myPid();if(!pid)return`<div class=card><h3>Your character</h3>${claimUI()}</div>`;const s=SH[pid]||{},n=((PL.find(x=>x.id==pid))||{}).n||'Your character';return`<div class=card><h3>${E(n)}</h3><div class=mu>Your sheet. The DM can see and edit it, and your stats feed the combat tracker.</div><div class=g>${fld('cls','Class & level',s.cls)}${fld('max','Max HP',s.max,1)}${fld('ac','AC',s.ac,1)}${fld('sp','Speed (ft)',s.sp,1)}${fld('pp','Passive Perception',s.pp,1)}${fld('dc','Spell save DC',s.dc,1)}</div>${fld('rs','Resistances / immunities',s.rs)}${ar('atk','Attacks & spells',s.atk)}${ar('inv','Inventory',s.inv)}${ar('nt','Notes',s.nt)}<div class=r><span class=mu>${E(SHM)}</span><button onclick=unclaim()>Switch character</button></div></div>`}
function battleList(){return`<div class=card><b>Round ${P.round}</b></div>${P.cs.map(c=>`<div class="card ${P.turn==c.id?"turn":""}"><div class=r><b>${E(c.n)}</b><span>${c.pc?`${c.hp}/${c.max}${c.t?" +"+c.t:""}`:`<b>${c.st}</b>`}</span></div>${bar(c.pc?c:{hp:c.st=="Healthy"?1:c.st=="Bloodied"?.4:c.st=="Near death"?.1:0,max:1})}<div>${chips(c,0)}</div></div>`).join("")}${Object.keys(P.lb).length?`<div class=card><h3>This battle</h3>${Object.entries(P.lb).map(([n,v])=>`<div class=r><span>${E(n)}</span><span class=mu>${v[0]} dmg · ${v[1]} healed · ${v[2]} kills</span></div>`).join("")}</div>`:""}`}
function player(){
const nav=`<div class=r style='justify-content:center;gap:8px'><button class="${pTab=='b'?'p':''}" onclick="ptab('b')">Battle${P&&P.rc?' ❗':''}</button><button class="${pTab=='s'?'p':''}" onclick="ptab('s')">My sheet</button></div>`;
if(pTab=='s')return nav+sheetH();
const o=P&&P.chest&&P.chest.open,ch=o?chestH(P.chest):'';
if(P&&P.rc)return nav+ch+readyH();
if(!o){seenC=false;LO={}}
if(!P)return nav+`<div class="card mu" style='text-align:center;padding:30px'>${NETERR?E(NETERR):!window.FB_CONFIG?'Live view isn’t set up in this copy yet.':!GID?'Create a shared game on the Party tab to use the live view.':NETA?'🕯️ Waiting for the DM to start sharing…':'Connecting…'}</div>`;
if(!P.victory&&!P.none)pdone=false;
if(P.victory&&!pdone)return nav+ch+vicH(P.victory,`<div class=r style='justify-content:center;margin-top:12px'><button class=p onclick=pcont()>Continue</button></div>`);
if(P.none||P.victory)return nav+ch+`<div class='card mu' style='text-align:center;padding:30px'>🕯️ Waiting for the next battle…</div>`;
return nav+ch+battleList()}
function render(){
const a=document.activeElement,pl=mode=="pl";
/* don't redraw under a player who is typing */
if(pl&&a&&a.id&&a.id.indexOf('sh_')==0)return;
const k=P&&P.rc?JSON.stringify(P.rc):'';
if(pl&&a&&a.id=='pi'&&k===RCK)return;
RCK=k;
if(pl&&P&&P.cs){if(PP&&PP.cs){const d=P.cs.filter(c=>{const o=!c.pc&&c.st=='Down'&&PP.cs.find(x=>x.id==c.id);return o&&o.st!='Down'});if(d.length)slay(d.map(c=>({name:c.n})))}PP=P}
let h=`<div class=r><h1>🦇 Ravenloft Combat Ledger</h1><span>${pl?"":`<button onclick=tg()>${share&&GID?"● Sharing":"Share live"}</button> `}${pl&&ISPL?"":`<button onclick=md()>${pl?"DM view":"Player view"}</button>`}</span></div>`
+(pl?player():({combat,prep,party,hist,life})[tab]())
+(modal&&S.cur&&(modal=="env"||gc(modal))?modalH():"")
+(pl?"":`<div class=tabs>${[["combat","Combat"],["prep","Prep"],["party","Party"],["hist","History"],["life","Stats"]].map(([k,v])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${v}</button>`).join("")}</div>`);
if(info&&S.cur&&gc(info))h+=infH();
if(dg)h+=dgH();
if(!pl&&S.cur&&S.cur.won&&!VD[S.cur.id])h+=vicH(vic(),`<div class=r style='justify-content:center;margin-top:12px'><button onclick=vrev()>Review battle</button><button class=p onclick=goHome()>Save &amp; go home</button></div>`);
$("#app").innerHTML=h}
/* ================= start-up ================= */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!ISPL)IDB.get().then(v=>{let d;try{d=v&&JSON.parse(v)}catch(e){}if(d&&!S.party.length&&!S.battles.length&&!S.cur&&(d.party.length||d.battles.length||d.cur)){S=d;S.tpl=S.tpl||{};S.enc=S.enc||{};prevS=JSON.stringify(S.cur);render()}else IDB.set(JSON.stringify(S))});
render();
netStart();
</script></body></html>
