const blk=(k,s,me)=>`<div class=card${me?" style='border-color:#c9a24a'":''}><b>${E(k)}${me?' (you)':''}</b><div class=g><span>Damage: ${s.dmg}</span><span>Healing: ${s.heal}</span><span>Kills: ${s.k}</span><span>Spells cast: ${s.sp}</span><span>Highest hit: ${s.hi}</span><span>Crits: ${s.cr}</span></div><div class=mu>${Object.entries(s.by||{}).map(([t,v])=>t+' '+v).join(' · ')||'No damage dealt yet'}</div></div>`;
const ks=Object.keys(L).sort((a,b)=>L[b].dmg-L[a].dmg);
let h=n?(L[n]?blk(n,L[n],1):`<div class="card mu">No stats for ${E(n)} yet. They appear after your first attack, spell or heal.</div>`):`<div class=card><h3>Which character are you?</h3>${claimUI()}</div>`;
if(ks.filter(k=>k!=n).length)h+=`<h3 style='margin-top:14px'>Party</h3>`+ks.filter(k=>k!=n).map(k=>blk(k,L[k],0)).join('');
return h+`<div class=mu style='text-align:center'>Across every battle so far, including the current one.</div>`}
function player(){

if(pTab=='s')return nav+sheetH();
if(pTab=='t')return nav+statsH();
const o=false,ch='';
if(P&&P.rc)return nav+ch+readyH();
if(!o){seenC=false;LO={}}
if(!P)return nav+(NETERR||!window.FB_CONFIG||!GID?`<div class="card mu" style='text-align:center;padding:30px'>${NETERR?E(NETERR):!window.FB_CONFIG?'Live view isn’t set up in this copy yet.':'Create a shared game on the Party tab to use the live view.'}</div>`:waitH(NETA?'Waiting for the DM to start sharing…':'Connecting…'));
if(!P.victory&&!P.none){pdone=false;delete VAN.p}
if(P.victory&&!pdone)return nav+ch+vicH(P.victory,`<div class=r style='justify-content:center;margin-top:12px'><button class=p onclick=pcont()>Continue</button></div>`,'p');
if(P.none||P.victory)return nav+ch+waitH('Waiting for the next battle…');
return nav+ch+battleList()}
function render(){

/* don't redraw under a player who is typing */
if(pl&&a&&a.id&&a.id.indexOf('sh_')==0)return;

+(pl?player():({combat,prep,party,hist,life})[tab]())
+(modal&&S.cur&&(modal=="env"||gc(modal))?modalH():"")
+(pl?"":`<div class=tabs>${[["combat","Combat"],["prep","Prep"],["party","Party"],["hist","History"],["life","Stats"]].map(([k,v])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${v}</button>`).join("")}</div>`);
if(info&&S.cur&&gc(info))h+=infH();
if(dg)h+=dgH();
if(!pl&&S.cur&&S.cur.won&&!VD[S.cur.id])h+=vicH(vic(),lootBlock()+`<div class=r style='justify-content:center;margin-top:12px'><button onclick=vrev()>Review battle</button><button class=p onclick=goHome()>Save &amp; go home</button></div>`,'d'+S.cur.id);
$("#app").innerHTML=h;lbR()}
/* ================= start-up ================= */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!ISPL)IDB.get().then(v=>{let d;try{d=v&&JSON.parse(v)}catch(e){}if(d&&!S.party.length&&!S.battles.length&&!S.cur&&(d.party.length||d.battles.length||d.cur)){S=d;S.tpl=S.tpl||{};S.enc=S.enc||{};prevS=JSON.stringify(S.cur);render()}else IDB.set(JSON.stringify(S))});
render();
netStart();
</script></body></html>
